  # Rails only ships built-in ActiveRecord error translations for `en`; without
  # this, any `dependent: :restrict_with_error` association (e.g. deleting a
  # Mesa/Team that still has Estagios, or an Estagio that still has tickets)
  # renders "Translation missing" instead of a real pt_BR message.
  activerecord:
    errors:
      messages:
        restrict_dependent_destroy:
          has_one: 'Não é possível excluir o registro pois existe um(a) %{record} dependente'
          has_many: 'Não é possível excluir o registro pois existem %{record} dependentes'
