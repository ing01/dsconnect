type: object
description: O payload de um ticket para a API de Integracao - pensado para uma IA externa analisar e decidir o roteamento.
properties:
  id:
    type: number
  display_id:
    type: number
  title:
    type: string
  description:
    type:
      - string
      - 'null'
  status:
    type: string
    enum: [open, resolved, closed, cancelled]
  priority:
    type:
      - string
      - 'null'
    enum: [low, medium, high, urgent, null]
  created_at:
    type: string
    format: date-time
  due_date:
    type:
      - string
      - 'null'
    format: date-time
  team:
    type: object
    properties:
      id:
        type: number
      name:
        type: string
  ticket_column:
    type: object
    description: O Estagio atual do ticket no Kanban
    properties:
      id:
        type: number
      name:
        type: string
  ticket_category:
    type:
      - object
      - 'null'
    properties:
      id:
        type: number
      name:
        type: string
  ticket_complexity:
    type:
      - object
      - 'null'
    properties:
      id:
        type: number
      name:
        type: string
  company:
    type:
      - object
      - 'null'
    properties:
      id:
        type: number
      name:
        type: string
  requester:
    type:
      - object
      - 'null'
    description: O contato que abriu o chamado
    properties:
      name:
        type: string
      email:
        type:
          - string
          - 'null'
  customer_communications:
    type: array
    description: A conversa com o cliente sobre este ticket (nunca inclui notas internas da equipe)
    items:
      type: object
      properties:
        direction:
          type: string
          enum: [outbound, inbound]
        body:
          type: string
        sent_at:
          type: string
          format: date-time
        author_name:
          type:
            - string
            - 'null'
  attachments:
    type: array
    items:
      type: object
      properties:
        filename:
          type: string
        content_type:
          type: string
        url:
          type: string
