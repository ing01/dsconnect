tags:
  - Ticket Routing
operationId: list-sprints-for-integration
summary: List the sprints of the account
security:
  - ticketApiKey: []
description: "The sprints of the key's account, by start date - the valid `sprint_id` values. `active: true` marks the sprint in progress of each Mesa. Use `team_id` and `status` to narrow."
parameters:
  - name: team_id
    in: query
    schema:
      type: number
  - name: status
    in: query
    description: A value outside the list answers 422 (not an empty list).
    schema:
      type: string
      enum: [upcoming, active, completed]
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/integration_sprint'
  '401':
    description: Unauthorized - missing or invalid `X-Ticket-Api-Key`
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'

  '404':
    description: Mesa not found (does not exist, or belongs to another account)
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'

  '422':
    description: Invalid `status`
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_validation_error'
        example:
          error: ticket_column_id does not belong to team_id
          message: ticket_column_id does not belong to team_id
          attributes:
            - ticket_column_id

  '429':
    description: Too many requests - the limit is 120 per minute for each API key. Wait `Retry-After` seconds before trying again.
    headers:
      Retry-After:
        description: Seconds until the current window resets
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_rate_limit_error'
        example:
          error: rate_limit_exceeded
          message: 'Too many requests: the limit is 120 per 60 seconds for each API key. Retry in 23 seconds.'
          limit: 120
          period_seconds: 60
          retry_after: 23
