tags:
  - Ticket Routing
operationId: route-ticket
summary: Route and/or update a ticket
security:
  - ticketApiKey: []
description: Applies any combination of routing/classification changes - every field is optional and applied independently, so this same endpoint also works as a general-purpose "update" for an external system (set the priority, assign someone, merge custom_attributes...) without requiring `team_id`. `note` is posted as a visible activity on the ticket for the team's awareness.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          team_id:
            type: number
            description: The Mesa (team) to move the ticket into. Without `ticket_column_id`, the ticket goes to the Mesa's first Estagio (no change if it is already in that Mesa). A Mesa of another account answers 404.
          ticket_column_id:
            type: number
            description: The Estagio to move the ticket into. Without `team_id`, the Mesa is the Estagio's (this used to be ignored when `team_id` was missing). With both, the Estagio must belong to the Mesa (422). Blank means "do not move".
          service_catalog_item_id:
            type: number
            description: The Catalogo > Area > Item classification, if the AI determined one
          ticket_category_id:
            type: number
            description: Must belong to the target Mesa
          ticket_complexity_id:
            type: number
          assignee_id:
            type: number
            description: Sets the ticket's Nivel 1 responsavel. Must be a user of the same account.
          priority:
            type: string
            enum: [low, medium, high, urgent]
          development_type:
            type: string
            enum: [bug, task, story]
            description: Campos do desenvolvimento - bug (Bug), task (Tarefa) or story (Historia). Blank clears it; another value is 422.
          sprint_id:
            type: number
            description: A sprint of the ticket's Mesa (see GET /sprints). Blank returns the ticket to the Backlog. When the ticket changes Mesa while in a sprint, send `sprint_id` (blank for Backlog) in the same request - otherwise 422.
          observacoes_dev:
            type: string
            description: Observacoes do Desenvolvedor (campo do desenvolvimento). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.observacoes_dev.
          observacoes_teste:
            type: string
            description: Observacoes Sobre o Teste Realizado (campo do desenvolvimento). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.observacoes_teste.
          documentacao:
            type: string
            description: Documentacao (campo do desenvolvimento). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.documentacao.
          instrucoes:
            type: string
            description: Instrucoes (campo do desenvolvimento). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.instrucoes.
          analise:
            type: string
            description: Analise (campo do desenvolvimento). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.analise.
          custom_attributes:
            type: object
            description: MERGED into the ticket's existing custom_attributes (never replaces the whole object) - use this for any field your system owns that DSConnect doesn't have a dedicated column for (analysis, dev notes, documentation links, hours, etc). The development text fields shown on tickets of a Mesa with the Desenvolvimento module use these keys (long text, up to 100000 characters each) - `observacoes_dev`, `observacoes_teste`, `documentacao`, `instrucoes`, `analise`. Any other key is capped at 1500 characters per string value.
            additionalProperties: true
          note:
            type: string
            description: A short note explaining the routing decision, posted as a visible activity on the ticket. On this endpoint it gets the prefix `Direcionado automaticamente pela IA de triagem:` (the triage flow) unless `triage` is false.
          triage:
            type: boolean
            default: true
            description: When `false`, `note` is recorded exactly as sent, without the triage-AI prefix.
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ticket_integration'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Invalid routing (e.g. the stage does not belong to the given Mesa)
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '429':
    description: Too many requests - the limit is 120 per minute for each API key. Wait `Retry-After` seconds before trying again.
    headers:
      Retry-After:
        description: Seconds until the current window resets
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_rate_limit_error'
        example:
          error: rate_limit_exceeded
          message: 'Too many requests: the limit is 120 per 60 seconds for each API key. Retry in 23 seconds.'
          limit: 120
          period_seconds: 60
          retry_after: 23
