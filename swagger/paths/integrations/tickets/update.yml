tags:
  - Ticket Routing
operationId: update-ticket
summary: Update a ticket
security:
  - ticketApiKey: []
description: Same as `PATCH .../route` (this is the REST-style alias). Applies any combination of routing/classification changes - every field is optional and applied independently, so this same endpoint also works as a general-purpose "update" for an external system (set the priority, assign someone, merge custom_attributes...) without requiring `team_id`. `note` is posted as a visible activity on the ticket for the team's awareness.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          team_id:
            type: number
            description: The Mesa (team) to move the ticket into
          ticket_column_id:
            type: number
            description: The Estagio (stage) within that Mesa. Defaults to the Mesa's first stage when omitted. Only applied when `team_id` is also present.
          service_catalog_item_id:
            type: number
            description: The Catalogo > Area > Item classification, if the AI determined one
          ticket_category_id:
            type: number
            description: Must belong to the target Mesa
          ticket_complexity_id:
            type: number
          assignee_id:
            type: number
            description: Sets the ticket's Nivel 1 responsavel. Must be a user of the same account.
          priority:
            type: string
            enum: [low, medium, high, urgent]
          observacoes_dev:
            type: string
            description: Observacoes do Desenvolvedor (campo do card do Jira). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.observacoes_dev.
          observacoes_teste:
            type: string
            description: Observacoes Sobre o Teste Realizado (campo do card do Jira). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.observacoes_teste.
          documentacao:
            type: string
            description: Documentacao (campo do card do Jira). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.documentacao.
          instrucoes:
            type: string
            description: Instrucoes (campo do card do Jira). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.instrucoes.
          analise:
            type: string
            description: Analise (campo do card do Jira). Texto longo, ate 100000 caracteres. Gravado tambem em custom_attributes.analise.
          custom_attributes:
            type: object
            description: MERGED into the ticket's existing custom_attributes (never replaces the whole object) - use this for any field your system owns that DSConnect doesn't have a dedicated column for (analysis, dev notes, documentation links, hours, etc). The Jira card text fields shown on tickets of a Mesa with the Desenvolvimento module use these keys (long text, up to 100000 characters each) - `observacoes_dev`, `observacoes_teste`, `documentacao`, `instrucoes`, `analise`. Any other key is capped at 1500 characters per string value.
            additionalProperties: true
          note:
            type: string
            description: A short note explaining the routing decision, posted as a visible activity on the ticket
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ticket_integration'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Invalid routing (e.g. the stage does not belong to the given Mesa)
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
