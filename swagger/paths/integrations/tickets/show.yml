tags:
  - Ticket Routing
operationId: show-ticket-for-integration
summary: Get a ticket
security:
  - ticketApiKey: []
description: "Returns the full payload an external system needs to read the ticket - content, classification, development fields (`development_type`, `sprint_id`), assignee, company/requester and the customer-facing communication thread. Never includes the team's internal comments. `attachments[].url` is a permanent link that REQUIRES authentication: send the same `X-Ticket-Api-Key` header when downloading it (it answers 302 to a signed link valid for 5 minutes); without credentials it answers 401."
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ticket_integration'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Ticket not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '429':
    description: Too many requests - the limit is 120 per minute for each API key. Wait `Retry-After` seconds before trying again.
    headers:
      Retry-After:
        description: Seconds until the current window resets
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_rate_limit_error'
        example:
          error: rate_limit_exceeded
          message: 'Too many requests: the limit is 120 per 60 seconds for each API key. Retry in 23 seconds.'
          limit: 120
          period_seconds: 60
          retry_after: 23
