tags:
  - Ticket Routing
operationId: list-tickets-for-integration
summary: List tickets
security:
  - ticketApiKey: []
description: Lists tickets for the account the API key belongs to, paginated, newest first. Every filter below is optional and can be combined.
parameters:
  - name: page
    in: query
    schema:
      type: number
  - name: per_page
    in: query
    schema:
      type: number
  - name: status
    in: query
    schema:
      type: string
      enum: [open, resolved, closed, cancelled]
  - name: team_id
    in: query
    schema:
      type: number
  - name: ticket_column_id
    in: query
    description: The Estagio (stage) the ticket is currently in
    schema:
      type: number
  - name: ticket_category_id
    in: query
    schema:
      type: number
  - name: company_id
    in: query
    schema:
      type: number
  - name: assignee_id
    in: query
    schema:
      type: number
  - name: created_after
    in: query
    schema:
      type: string
      format: date-time
  - name: display_id
    in: query
    description: The ticket number (the "#35369" shown on screen, unique per account) - not the database id used in the URL. Finds the ticket whatever its Mesa; a number that does not exist finds nothing.
    schema:
      type: number
  - name: jira_key
    in: query
    description: The Jira card key linked in the ticket's Development tab (e.g. "DM-3634"). Exact match, ignoring case and surrounding spaces; a key that is not linked to any ticket finds nothing. Returns the same fields as the other filters.
    schema:
      type: string
  - name: sprint_id
    in: query
    description: Only the tickets of this sprint (see GET /sprints). A sprint of another account, or one that does not exist, is a 404.
    schema:
      type: number
  - name: development_type
    in: query
    description: Campos do desenvolvimento - bug, task or story
    schema:
      type: string
      enum: [bug, task, story]
  - name: updated_after
    in: query
    schema:
      type: string
      format: date-time
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            meta:
              type: object
              properties:
                count:
                  type: number
                current_page:
                  type: number
            payload:
              type: array
              items:
                $ref: '#/components/schemas/ticket_integration_list_item'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '429':
    description: Too many requests - the limit is 120 per minute for each API key. Wait `Retry-After` seconds before trying again.
    headers:
      Retry-After:
        description: Seconds until the current window resets
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_rate_limit_error'
        example:
          error: rate_limit_exceeded
          message: 'Too many requests: the limit is 120 per 60 seconds for each API key. Retry in 23 seconds.'
          limit: 120
          period_seconds: 60
          retry_after: 23
