tags:
  - Ticket Routing
operationId: list-ticket-complexities-for-integration
summary: List valid complexities
security:
  - ticketApiKey: []
description: The account's active Complexidades - the valid `ticket_complexity_id` values for `POST /integrations/tickets` and `PATCH /integrations/tickets/{id}/route`. TicketComplexity is account-wide (not per-Mesa); which Mesas actually offer a given level is not exposed here - an id valid for the account but not available for the ticket's Mesa is rejected with a 422.
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ticket_complexity_integration_list_item'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '429':
    description: Too many requests - the limit is 120 per minute for each API key. Wait `Retry-After` seconds before trying again.
    headers:
      Retry-After:
        description: Seconds until the current window resets
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_rate_limit_error'
        example:
          error: rate_limit_exceeded
          message: 'Too many requests: the limit is 120 per 60 seconds for each API key. Retry in 23 seconds.'
          limit: 120
          period_seconds: 60
          retry_after: 23
