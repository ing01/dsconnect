tags:
  - Ticket Routing
operationId: list-ticket-categories-for-integration
summary: List valid classification targets (Categorias), grouped by Mesa
security:
  - ticketApiKey: []
description: Ticket categories, grouped by the Mesa (team) that owns them - the valid `ticket_category_id` values for the routing endpoint.
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              team_id:
                type: number
              team_name:
                type: string
              ticket_categories:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    name:
                      type: string
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '429':
    description: Too many requests - the limit is 120 per minute for each API key. Wait `Retry-After` seconds before trying again.
    headers:
      Retry-After:
        description: Seconds until the current window resets
        schema:
          type: integer
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/integration_rate_limit_error'
        example:
          error: rate_limit_exceeded
          message: 'Too many requests: the limit is 120 per 60 seconds for each API key. Retry in 23 seconds.'
          limit: 120
          period_seconds: 60
          retry_after: 23
