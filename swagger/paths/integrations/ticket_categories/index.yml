tags:
  - Ticket Routing
operationId: list-ticket-categories-for-integration
summary: List valid classification targets (Categorias), grouped by Mesa
security:
  - ticketApiKey: []
description: Ticket categories, grouped by the Mesa (team) that owns them - the valid `ticket_category_id` values for the routing endpoint.
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              team_id:
                type: number
              team_name:
                type: string
              ticket_categories:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    name:
                      type: string
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
